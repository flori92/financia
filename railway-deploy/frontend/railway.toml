# 🚀 Configuration Railway BMS - 100% Dynamique
# Toutes les données depuis PostgreSQL, zéro mock data

[build]
builder = "NIXPACKS"
buildCommand = "npm run build"

[deploy]
healthcheckPath = "/health"
healthcheckTimeout = 100
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10

[[services]]
name = "bms-web"

[services.variables]
NODE_ENV = "production"
NEXT_PUBLIC_API_URL = "${{RAILWAY_PUBLIC_DOMAIN}}"
NEXT_PUBLIC_RAILWAY_ENVIRONMENT = "production"

[services.build]
builder = "NIXPACKS"
buildCommand = "npm run build"

[services.deploy]
healthcheckPath = "/"
healthcheckTimeout = 100
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10

# Configuration Production Railway
[production]
NODE_ENV = "production"
NEXT_PUBLIC_API_URL = "https://bms-api-gateway.up.railway.app"
NEXT_PUBLIC_API_TOKEN = "votre_jwt_token_production"
NEXT_PUBLIC_COMPANY_ID = "1805bc61-7cfd-44e9-8a63-17187bf05dc7"

# Base de données PostgreSQL
[database]
url = "${{RAILWAY_DATABASE_URL}}"

# Services API connectés
[api]
accounting = "https://bms-api-gateway.up.railway.app/api/v1/accounting"
treasury = "https://bms-api-gateway.up.railway.app/api/v1/treasury"
budget = "https://bms-api-gateway.up.railway.app/api/v1/budget"
communications = "https://bms-api-gateway.up.railway.app/api/v1/communications"

# Endpoints validés
[endpoints]
dashboard_metrics = "/api/v1/accounting/dashboard/metrics"
treasury_metrics = "/api/v1/treasury/metrics"
budget_metrics = "/api/v1/budget/metrics"
communications_metrics = "/api/v1/communications/metrics"

# Tables PostgreSQL requises
[database_tables]
journal_entries = "journal_entries"
journal_lines = "journal_lines"
accounts = "accounts"
bank_accounts = "bank_accounts"
treasury_transactions = "treasury_transactions"
budget_categories = "budget_categories"
budget_forecasts = "budget_forecasts"
communication_campaigns = "communication_campaigns"
communication_messages = "communication_messages"
delivery_logs = "delivery_logs"

# Monitoring & Health
[monitoring]
health_check = "/health"
api_docs = "/api/docs"
metrics = "/metrics"

# Performance
[performance]
build_timeout = 300
deploy_timeout = 180
healthcheck_timeout = 100
memory_limit = "512MB"
cpu_limit = "1.0"

# Sécurité
[security]
cors_origins = ["${{RAILWAY_PUBLIC_DOMAIN}}"]
jwt_secret = "${{JWT_SECRET}}"
api_rate_limit = "100/hour"

# Domaines personnalisés
[domains]
primary = "${{RAILWAY_PUBLIC_DOMAIN}}"
api = "api.bms.railway.app"

# Logs & Debug
[logging]
level = "info"
format = "json"
destination = "console"
