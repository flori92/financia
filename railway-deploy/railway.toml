# BMS ERP - Railway Configuration

[build]
builder = "NIXPACKS"

# Backend Service
[[services]]
name = "bms-backend"

[sources.paths]
path = "backend"

[services.variables]
NODE_ENV = "production"
PORT = "3001"
DATABASE_URL = "${{Postgres.DATABASE_URL}}"
JWT_SECRET = "${{JWT_SECRET}}"

[[services.ports]]
port = 3001
handlers = ["http"]

[services.healthcheck]
path = "/health"
timeout = 100

# Frontend Service
[[services]]
name = "bms-frontend"

[sources.paths]
path = "frontend"

[services.variables]
NODE_ENV = "production"
PORT = "3000"
NEXT_PUBLIC_API_URL = "${{bms-backend.url}}"

[[services.ports]]
port = 3000
handlers = ["http"]

[services.healthcheck]
path = "/"
timeout = 100
