# Configuration Railway pour BMS API - Version Docker Express
[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile-express"

[deploy]
startCommand = "node index.js"
healthcheckPath = "/health"
healthcheckTimeout = 100
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5

[env]
NODE_ENV = "production"
PORT = "3001"

[service]
name = "bms-api-gateway"
