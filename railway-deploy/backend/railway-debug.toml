# Configuration Railway pour BMS API - Version Debug
[build]
builder = "NIXPACKS"

[deploy]
startCommand = "node dist/main-minimal"
healthcheckPath = "/health"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5

[env]
NODE_ENV = "production"
PORT = "8080"

[service]
name = "bms-api-gateway-debug"
