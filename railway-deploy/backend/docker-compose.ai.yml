version: '3.8'

services:
  # Service IA Principal
  bms-ai-service:
    build: ./ai-service
    ports:
      - "8000:8000"
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - DATABASE_URL=postgresql://postgres:password@postgres:5432/bms_ai
    depends_on:
      - redis
      - postgres
      - bms-llm-service
    volumes:
      - ./ai-service/logs:/app/logs
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Service LLM Local (Llama/Mistral)
  bms-llm-service:
    build: 
      context: ./ai-service
      dockerfile: Dockerfile.llm
    ports:
      - "8001:8001"
    environment:
      - TRANSFORMERS_CACHE=/app/models
      - TORCH_HOME=/app/torch
    volumes:
      - llm_models:/app/models
      - llm_torch:/app/torch
    restart: unless-stopped
    # Plus de ressources pour les modèles LLM
    deploy:
      resources:
        limits:
          memory: 4G
        reservations:
          memory: 2G
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 60s
      timeout: 30s
      retries: 3

  # Redis pour le cache et les tâches async
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped
    command: redis-server --appendonly yes

  # PostgreSQL pour stocker les modèles et résultats
  postgres:
    image: postgres:15-alpine
    environment:
      - POSTGRES_DB=bms_ai
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./ai-service/init.sql:/docker-entrypoint-initdb.d/init.sql
    restart: unless-stopped

  # Jupyter Notebook pour le développement ML
  jupyter-ml:
    image: jupyter/scipy-notebook:latest
    ports:
      - "8888:8888"
    environment:
      - JUPYTER_ENABLE_LAB=yes
    volumes:
      - ./ml-notebooks:/home/jovyan/work
      - ./ai-service:/home/jovyan/ai-service
    command: start-notebook.sh --NotebookApp.token=''
    depends_on:
      - postgres
      - redis

  # Monitoring avec Grafana
  grafana:
    image: grafana/grafana:latest
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards
      - ./monitoring/grafana/datasources:/etc/grafana/provisioning/datasources
    depends_on:
      - bms-ai-service

  # Prometheus pour les métriques
  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
    depends_on:
      - bms-ai-service

volumes:
  postgres_data:
  redis_data:
  grafana_data:
  prometheus_data:
  llm_models:
  llm_torch:

networks:
  default:
    name: bms-ai-network
