# Configuration Kubernetes pour l'API Gateway
apiVersion: v1
kind: ConfigMap
metadata:
  name: bms-api-gateway-config
  namespace: production
data:
  NODE_ENV: "production"
  PORT: "3000"
  DATABASE_URL: "postgres://user:password@postgres-service:5432/bms"
  REDIS_URL: "redis://redis-service:6379"
---
apiVersion: v1
kind: Secret
metadata:
  name: bms-api-gateway-secrets
  namespace: production
type: Opaque
data:
  JWT_SECRET: ${JWT_SECRET_BASE64}
  SLACK_WEBHOOK_URL: ${SLACK_WEBHOOK_URL_BASE64}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bms-api-gateway
  namespace: production
spec:
  replicas: 3
  selector:
    matchLabels:
      app: bms-api-gateway
  template:
    metadata:
      labels:
        app: bms-api-gateway
    spec:
      containers:
        - name: api-gateway
          image: myorg/bms-api-gateway:latest
          ports:
            - containerPort: 3000
          envFrom:
            - configMapRef:
                name: bms-api-gateway-config
            - secretRef:
                name: bms-api-gateway-secrets
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          livenessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: bms-api-gateway-service
  namespace: production
spec:
  selector:
    app: bms-api-gateway
  ports:
    - protocol: TCP
      port: 80
      targetPort: 3000
  type: ClusterIP
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: bms-api-gateway-ingress
  namespace: production
  annotations:
    kubernetes.io/ingress.class: "nginx"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  tls:
    - hosts:
        - api.bms.example.com
      secretName: bms-api-tls
  rules:
    - host: api.bms.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: bms-api-gateway-service
                port:
                  number: 80
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: bms-api-gateway-hpa
  namespace: production
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: bms-api-gateway
  minReplicas: 3
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: bms-api-gateway-network-policy
  namespace: production
spec:
  podSelector:
    matchLabels:
      app: bms-api-gateway
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              name: ingress-nginx
      ports:
        - protocol: TCP
          port: 3000
  egress:
    - to:
        - namespaceSelector: {}
          podSelector:
            matchLabels:
              app: postgres
      ports:
        - protocol: TCP
          port: 5432
    - to:
        - namespaceSelector: {}
          podSelector:
            matchLabels:
              app: redis
      ports:
        - protocol: TCP
          port: 6379