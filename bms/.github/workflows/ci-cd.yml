# Configuration CI/CD avec GitHub Actions

name: BMS API Gateway CI/CD

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

jobs:
  test:
    name: Tests unitaires et d'intégration
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:14-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:6-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          cache: 'npm'

      - name: Installation des dépendances
        run: npm ci

      - name: Vérification du format
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Tests unitaires
        run: npm run test

      - name: Tests d'intégration
        run: npm run test:e2e
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/test_db
          REDIS_URL: redis://localhost:6379
          JWT_SECRET: test-secret

      - name: Couverture de code
        run: npm run test:cov

  build:
    name: Build et push de l'image Docker
    needs: test
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')

    steps:
      - uses: actions/checkout@v3

      - name: Configuration de Docker
        uses: docker/setup-buildx-action@v2

      - name: Login à DockerHub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build et push
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          tags: |
            myorg/bms-api-gateway:${{ github.sha }}
            myorg/bms-api-gateway:latest
          cache-from: type=registry,ref=myorg/bms-api-gateway:latest
          cache-to: type=inline

  deploy:
    name: Déploiement
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Configuration de Kubernetes
        uses: azure/k8s-set-context@v2
        with:
          kubeconfig: ${{ secrets.KUBE_CONFIG }}

      - name: Mise à jour du déploiement
        run: |
          kubectl set image deployment/bms-api-gateway \
            api-gateway=myorg/bms-api-gateway:${{ github.sha }} \
            --namespace production

      - name: Vérification du déploiement
        run: |
          kubectl rollout status deployment/bms-api-gateway \
            --namespace production \
            --timeout=300s

  notify:
    name: Notification Slack
    needs: [deploy]
    runs-on: ubuntu-latest
    if: always()

    steps:
      - name: Notification de déploiement
        uses: 8398a7/action-slack@v3
        with:
          status: ${{ job.status }}
          fields: repo,message,commit,author,action,eventName,ref,workflow,job,took
          text: "Déploiement ${{ job.status == 'success' && 'réussi' || 'échoué' }} pour BMS API Gateway"
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}