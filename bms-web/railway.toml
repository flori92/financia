[build]
builder = "NIXPACKS"

[deploy]
healthcheckPath = "/"
healthcheckTimeout = 100
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10

[env]
NODE_ENV = "production"
PORT = "3000"
NEXT_PUBLIC_API_URL = "${{NEXT_PUBLIC_API_URL}}"

[[services]]
name = "frontend"

[services.variables]
NODE_ENV = "production"
PORT = "3000"
NEXT_PUBLIC_API_URL = "${{NEXT_PUBLIC_API_URL}}"

[[services.ports]]
port = 3000
handlers = ["http"]
