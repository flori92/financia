version: "3.9"

services:
  postgres:
    image: postgres:15-alpine
    container_name: bms-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: bms
      POSTGRES_USER: bms
      POSTGRES_PASSWORD: bms_dev_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/initdb.d:/docker-entrypoint-initdb.d
    networks:
      - bms-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bms"]
      interval: 10s
      timeout: 5s
      retries: 6

  redis:
    image: redis:7-alpine
    container_name: bms-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: ["redis-server", "--save", "60", "1"]
    volumes:
      - redis_data:/data
    networks:
      - bms-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  minio:
    image: minio/minio:RELEASE.2024-09-22T00-33-43Z
    container_name: bms-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin123
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    networks:
      - bms-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

  minio-init:
    image: minio/mc:RELEASE.2024-09-22T00-33-43Z
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
        /usr/bin/mc alias set bms http://minio:9000 minioadmin minioadmin123;
        /usr/bin/mc mb bms/bms-uploads --ignore-existing;
        /usr/bin/mc anonymous set download bms/bms-uploads;
        exit 0;
      "
    networks:
      - bms-network

  api:
    build:
      context: ./bms/api-gateway
      dockerfile: Dockerfile
    container_name: bms-api
    restart: unless-stopped
    env_file:
      - ./bms/api-gateway/.env.local
    environment:
      DATABASE_URL: postgres://bms:bms_dev_password@postgres:5432/bms
      REDIS_URL: redis://redis:6379
      STORAGE_PROVIDER: ${STORAGE_PROVIDER:-minio}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:-http://minio:9000}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin123}
      MINIO_BUCKET: ${MINIO_BUCKET:-bms-uploads}
      MINIO_USE_SSL: ${MINIO_USE_SSL:-false}
      MINIO_REGION: ${MINIO_REGION:-}
      MINIO_FORCE_PATH_STYLE: ${MINIO_FORCE_PATH_STYLE:-false}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    ports:
      - "3001:3001"
    volumes:
      - ./bms/api-gateway:/app
      - /app/node_modules
      - uploads_data:/app/uploads
    networks:
      - bms-network
    command: npm run start:dev

  worker:
    build:
      context: ./bms/api-gateway
      dockerfile: Dockerfile
    container_name: bms-worker
    restart: unless-stopped
    env_file:
      - ./bms/api-gateway/.env.local
    environment:
      WORKER_MODE: bull
      DATABASE_URL: postgres://bms:bms_dev_password@postgres:5432/bms
      REDIS_URL: redis://redis:6379
      STORAGE_PROVIDER: ${STORAGE_PROVIDER:-minio}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:-http://minio:9000}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin123}
      MINIO_BUCKET: ${MINIO_BUCKET:-bms-uploads}
      MINIO_USE_SSL: ${MINIO_USE_SSL:-false}
      MINIO_REGION: ${MINIO_REGION:-}
      MINIO_FORCE_PATH_STYLE: ${MINIO_FORCE_PATH_STYLE:-false}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./bms/api-gateway:/app
      - /app/node_modules
    networks:
      - bms-network
    command: npm run start:worker

  web:
    build:
      context: ./bms-web
      dockerfile: Dockerfile
    container_name: bms-web
    restart: unless-stopped
    env_file:
      - ./bms-web/.env.local
    depends_on:
      api:
        condition: service_started
    ports:
      - "3000:3000"
    volumes:
      - ./bms-web:/app
      - /app/node_modules
      - /app/.next
    networks:
      - bms-network
    command: npm run dev

networks:
  bms-network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  minio_data:
  uploads_data:
